site_name: GraphPPI
site_description: Graph Neural Network for Protein-Protein Interaction Link Prediction
repo_url: https://github.com/Totheinfinity66y/GraphPPI_test
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
  palette:
    primary: indigo
    accent: teal

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - API 参考:
      - 数据预处理: api/preprocess.md
      - 工具函数: api/utils.md
      - 模型: api/models.md
      - 训练器: api/trainer.md
      - 评估指标: api/metrics.md
      - CLI: api/cli.md
      - 基因排序: api/rank_genes.md
  - 基准测试: benchmark.md
  - 数据集: datasets.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - footnotes
