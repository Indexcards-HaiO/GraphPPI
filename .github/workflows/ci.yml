name: GraphPPI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torch_geometric --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verify data files
        run: |
          if [ ! -f data/processed/graph.pt ]; then
            echo "Missing graph.pt — run preprocess first or download from release"
            python -m graphppi.cli preprocess 2>/dev/null || echo "Skipping preprocess"
          fi

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke-test CLI
        run: |
          graphppi --help
